<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myAsset · 로그인</title>
  <link rel="stylesheet" href="css/style.css?v=20261011m">
</head>
<body class="login-page">
  <main class="login-wrap">
    <form class="card login-card" id="login-form" autocomplete="on" novalidate>
      <div class="brand login-brand">my<b>Asset</b></div>
      <p class="muted small" style="margin:0 0 18px">자산관리 · 로그인이 필요합니다</p>
      <div class="field">
        <label for="login-id">아이디</label>
        <input type="text" id="login-id" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="login-pw">비밀번호</label>
        <input type="password" id="login-pw" name="password" autocomplete="current-password" required>
      </div>
      <label class="check"><input type="checkbox" id="save-id"> 아이디 저장</label>
      <div class="notice" id="login-err" hidden></div>
      <button type="submit" class="btn btn-primary login-btn" id="login-btn">로그인</button>
      <p class="muted small login-foot">비밀번호는 이 기기에 저장되지 않습니다. 회원가입은 받지 않습니다.</p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=20261011m"></script>
  <script src="js/auth.js?v=20261011m"></script>
  <script src="js/pages/login.js?v=20261011m"></script>
</body>
</html>
